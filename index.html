<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>461 Anderson — Dining Table Watch</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head><body>
<p style="font-family:system-ui;margin:2rem">Loading evening board…</p>
<script>
(async () => {
  const parts = [];
  for (let i = 0; i < 8; i++) {
    const r = await fetch('_publish/' + i + '.b64');
    if (!r.ok) throw new Error('missing chunk ' + i);
    parts.push(await r.text());
  }
  const html = parts.map(b64 => {
    const bin = atob(b64.trim());
    const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
    return new TextDecoder('utf-8').decode(bytes);
  }).join('');
  document.open();
  document.write(html);
  document.close();
})().catch(e => {
  document.body.innerHTML = '<pre style="font-family:system-ui;padding:2rem">Board load failed: ' + e + '</pre>';
});
</script>
</body></html>
